name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git for the gh-pages deploy
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # gh-pages clones into its own cache directory (node_modules/.cache),
          # which doesn't inherit the credentials actions/checkout sets up only
          # for this working copy. Rewrite github.com URLs globally so that
          # clone picks up the token too.
          git config --global "url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf" "https://github.com/"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render and deploy
        run: npm run deploy
